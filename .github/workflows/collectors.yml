name: Run JobRadar Collectors

on:
  schedule:
    # Run every 30 minutes per PRD §6 & AGENTS.md
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  collect:
    name: Run Collectors
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./collectors[dev]"

      - name: Run collectors
        working-directory: ./collectors
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GREENHOUSE_BOARD_TOKEN: ${{ secrets.GREENHOUSE_BOARD_TOKEN || 'stripe' }}
        run: |
          python -m collectors.run

